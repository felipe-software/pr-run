name: "[PullRequest] Prettier Check"

on:
    pull_request:
        types:
            - opened
            - reopened
            - ready_for_review
            - synchronize

permissions:
    contents: read

concurrency:
    group: prettier-check-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    prettier-check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.7

            - name: Install dependencies
              run: bun install --frozen-lockfile --ignore-scripts

            - name: Run Prettier check
              run: bunx prettier --check .
