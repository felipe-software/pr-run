name: Publish npm package

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Tag to publish, for example v0.1.3
                required: true
                type: string
    push:
        tags:
            - "v*"

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: ubuntu-latest
        environment:
            name: npm
            url: https://www.npmjs.com/package/pr-run

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Verify tag version
              env:
                  PUBLISH_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
              run: |
                  PACKAGE_VERSION="$(node -p "require('./package.json').version")"
                  TAG_VERSION="${PUBLISH_TAG#v}"
                  if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
                    echo "Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION."
                    exit 1
                  fi

            - name: Format
              run: bun run format

            - name: Verify formatting
              run: git diff --exit-code

            - name: Typecheck
              run: bun run typecheck

            - name: Test
              run: bun test

            - name: Build npm package
              run: bun run build:npm

            - name: Publish
              run: npx --yes npm@11.5.1 publish --provenance --access public
